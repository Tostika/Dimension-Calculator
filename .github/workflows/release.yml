# Builds the Windows app and publishes it as a GitHub Release named after the VERSION file.
# Runs when VERSION changes on main (bump it to make a new release), or by hand from the Actions tab.
name: Release

on:
  push:
    branches: [main]
    paths: ["VERSION"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read VERSION
        id: v
        shell: pwsh
        run: echo "version=$((Get-Content VERSION).Trim())" >> $env:GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Check the measuring code
        run: python -m tests.test_vision

      - name: Check that camera names can be read
        run: python -c "from app.devices.camera import camera_names; n = camera_names(); print('camera names:', n); assert n is not None"

      - name: Build DimensionDevice.exe
        run: pyinstaller --noconfirm --windowed --name DimensionDevice --add-data "app/fonts;app/fonts" --collect-submodules pygrabber --hidden-import comtypes.stream main.py

      - name: Pack the release zip
        shell: pwsh
        run: |
          Copy-Item -Recurse print dist/DimensionDevice/print
          Copy-Item -Recurse firmware dist/DimensionDevice/firmware
          Copy-Item tools/freecad_import.FCMacro dist/DimensionDevice/
          Compress-Archive -Path dist/DimensionDevice/* -DestinationPath DimensionDevice-windows.zip

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: DimensionDevice-windows.zip
          generate_release_notes: true
